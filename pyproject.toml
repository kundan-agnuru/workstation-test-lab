[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "workstation-test-lab"
version = "0.1.0"
description = "Local workstation test automation, ingestion API, and results dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.12",
]

[project.scripts]
workstation-lab = "runner.cli:main"
workstation-ingest = "ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend", "runner", "parsers", "ingestion", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a database or multiple application components",
  "hardware: requires host hardware or vendor tools",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

