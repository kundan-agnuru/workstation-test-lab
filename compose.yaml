services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: workstation_lab
      POSTGRES_USER: workstation
      POSTGRES_PASSWORD: workstation
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workstation -d workstation_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://workstation:workstation@postgres:5432/workstation_lab
      DASHBOARD_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: dashboard
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  postgres-data:

